apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubewatch-api
spec:
  replicas: {{ .Values.api.replicaCount }}

  selector:
    matchLabels:
      app: kubewatch

  template:
    metadata:
      labels:
        app: kubewatch

    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}

          ports:
            - containerPort: 8000

          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
